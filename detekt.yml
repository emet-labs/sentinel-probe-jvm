# detekt.yml — permissive config for the JVM Probe SDK.
#
# Detekt's defaults flag style choices that are idiomatic in this SDK (long parameter lists
# on builder-style data classes, large sealed-class files mirroring the Go gate). This config
# builds on the default config and relaxes the handful of rules that would otherwise fight
# the reference structure rather than catch real defects.

complexity:
  LongParameterList:
    active: false
  LongMethod:
    active: false
  ComplexCondition:
    active: false
  CyclomaticComplexMethod:
    active: false
  LargeClass:
    active: false
  TooManyFunctions:
    active: false
exceptions:
  # decideFunc is the error-normalizing boundary: it must convert every
  # transport Throwable into the gate's explicit error variant.
  TooGenericExceptionCaught:
    active: false
naming:
  FunctionParameterNaming:
    active: false
  MatchingDeclarationName:
    active: false
style:
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  ThrowsCount:
    active: false
  MagicNumber:
    active: false
  UseDataClass:
    active: false
  NestedClassesVisibility:
    active: false
  # The parser deliberately owns precise configuration-error messages rather
  # than exposing require()'s assertion-style wording.
  UseRequire:
    active: false
